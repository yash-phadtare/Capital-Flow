<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add a new expense to Capital Flow.">
    <title>Add Expense - Capital Flow</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='17' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles/modern.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <header class="main-header">
        <div class="container header-content">
            <a href="index.html" class="logo"><i class="fas fa-wallet"></i> Capital Flow</a>
            <button class="mobile-menu-toggle" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>
            <nav class="main-nav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="add-expense.html" class="active">Add Expense</a></li>
                    <li><a href="view-expense.html">View Expenses</a></li>
                    <li class="nav-user" hidden><i class="fas fa-user"></i> <span class="nav-user-name"></span></li>
                    <li><a href="login.html" data-action="logout"><i class="fas fa-right-from-bracket"></i> Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="form-card">
                <div class="form-header">
                    <h1><i class="fas fa-circle-plus"></i> Add New Expense</h1>
                    <p>Track your spending by adding expenses below</p>
                </div>

                <form id="expense-form" novalidate>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="expense"><i class="fas fa-tag"></i> Expense Name</label>
                            <input type="text" id="expense" class="form-control" maxlength="120"
                                placeholder="e.g., Groceries" autocomplete="off" required>
                            <small class="input-error" id="expense-error"></small>
                        </div>

                        <div class="form-group">
                            <label for="category"><i class="fas fa-list"></i> Category</label>
                            <select id="category" class="form-control" required>
                                <option value="">Select a category</option>
                                <option value="Food & Dining">Food &amp; Dining</option>
                                <option value="Transportation">Transportation</option>
                                <option value="Housing">Housing</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Healthcare">Healthcare</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Education">Education</option>
                                <option value="Personal Care">Personal Care</option>
                                <option value="Travel">Travel</option>
                                <option value="Gifts & Donations">Gifts &amp; Donations</option>
                                <option value="Investments">Investments</option>
                                <option value="Other">Other</option>
                            </select>
                            <small class="input-error" id="category-error"></small>
                        </div>

                        <div class="form-group">
                            <label for="amount"><i class="fas fa-indian-rupee-sign"></i> Amount</label>
                            <div class="amount-input-wrap">
                                <input type="number" id="amount" class="form-control" placeholder="0.00" min="0.01"
                                    step="0.01" inputmode="decimal" required>
                            </div>
                            <small class="input-error" id="amount-error"></small>
                        </div>

                        <div class="form-group">
                            <label for="date"><i class="fas fa-calendar"></i> Date</label>
                            <input type="date" id="date" class="form-control" required>
                            <small class="input-error" id="date-error"></small>
                        </div>

                        <div class="form-group">
                            <label for="time"><i class="fas fa-clock"></i> Time</label>
                            <input type="time" id="time" class="form-control" required>
                            <small class="input-error" id="time-error"></small>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-block btn-lg">
                            <i class="fas fa-save"></i> Save Expense
                        </button>
                        <a href="view-expense.html" class="btn btn-outline btn-block btn-lg">
                            <i class="fas fa-list"></i> View All Expenses
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; <span class="current-year">2024</span> Capital Flow. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="scripts/common.js"></script>
    <script src="scripts/add-expense.js"></script>
</body>

</html>
