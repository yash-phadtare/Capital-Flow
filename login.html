<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to Capital Flow to manage your expenses.">
    <title>Login - Capital Flow</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='17' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles/modern.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <header class="main-header">
        <div class="container header-content">
            <a href="index.html" class="logo"><i class="fas fa-wallet"></i> Capital Flow</a>
            <button class="mobile-menu-toggle" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>
            <nav class="main-nav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="login.html" class="active">Login</a></li>
                    <li><a href="signup.html">Sign Up</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="card mx-auto mt-3" style="max-width: 400px;">
                <h1 class="page-title text-center">Login</h1>
                <form class="login-form" novalidate>
                    <div class="form-group">
                        <label for="username"><i class="fas fa-user"></i> Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Enter your username"
                            autocomplete="username" required>
                        <small class="input-error" id="username-error"></small>
                    </div>
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" class="form-control"
                                placeholder="Enter your password" autocomplete="current-password" required>
                            <button type="button" class="toggle-pass" aria-label="Show password"
                                aria-pressed="false"><i class="fas fa-eye"></i></button>
                        </div>
                        <small class="input-error" id="password-error"></small>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
                    <p class="text-center mt-3 muted">Don't have an account? <a href="signup.html">Sign Up</a></p>
                </form>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; <span class="current-year">2024</span> Capital Flow. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="scripts/common.js"></script>
    <script src="scripts/login.js"></script>
</body>

</html>
