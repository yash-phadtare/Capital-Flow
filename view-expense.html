<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search, filter, sort and export your Capital Flow expenses.">
    <title>View Expenses - Capital Flow</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='17' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles/modern.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <header class="main-header">
        <div class="container header-content">
            <a href="index.html" class="logo"><i class="fas fa-wallet"></i> Capital Flow</a>
            <button class="mobile-menu-toggle" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>
            <nav class="main-nav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="add-expense.html">Add Expense</a></li>
                    <li><a href="view-expense.html" class="active">View Expenses</a></li>
                    <li class="nav-user" hidden><i class="fas fa-user"></i> <span class="nav-user-name"></span></li>
                    <li><a href="login.html" data-action="logout"><i class="fas fa-right-from-bracket"></i> Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="page-head">
                <div>
                    <h1 class="page-title">Your Expenses</h1>
                    <p class="page-subtitle" id="filter-summary"></p>
                </div>
                <div class="page-actions">
                    <a href="add-expense.html" class="btn btn-primary"><i class="fas fa-plus"></i> Add Expense</a>
                </div>
            </div>

            <div class="card filter-bar">
                <div class="search-container">
                    <i class="fas fa-magnifying-glass"></i>
                    <input type="text" id="search" class="form-control search-input" placeholder="Search expenses..."
                        autocomplete="off">
                </div>
                <select id="category-filter" class="form-control filter-select" aria-label="Filter by category">
                    <option value="all">All Categories</option>
                </select>
                <button id="clear-filters" class="btn btn-ghost" hidden><i class="fas fa-rotate-left"></i> Clear</button>
                <button class="btn btn-secondary export-btn"><i class="fas fa-file-export"></i> Export CSV</button>
            </div>

            <div class="card expense-table-card">
                <div class="table-responsive">
                    <table id="expense-table">
                        <thead>
                            <tr>
                                <th class="sortable" data-sort="expense">Expense <i class="fas sort-icon fa-sort"></i></th>
                                <th class="sortable" data-sort="category">Category <i class="fas sort-icon fa-sort"></i></th>
                                <th class="sortable" data-sort="amount">Amount <i class="fas sort-icon fa-sort"></i></th>
                                <th class="sortable" data-sort="date">Date <i class="fas sort-icon fa-sort"></i></th>
                                <th class="sortable" data-sort="time">Time <i class="fas sort-icon fa-sort"></i></th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Expenses loaded by scripts/view-expense.js -->
                        </tbody>
                    </table>
                </div>
                <div class="table-summary">
                    <div class="table-count"><i class="fas fa-receipt"></i> <span id="expense-count"></span></div>
                    <div class="total-expenses">
                        <span>Total:</span>
                        <span id="total-amount">₹0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; <span class="current-year">2024</span> Capital Flow. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="scripts/common.js"></script>
    <script src="scripts/view-expense.js"></script>
</body>

</html>
